# Keep local docker-compose nginx proxy working for combined stack
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml;

    # PDFs na Biblioteca (multer limita a 30MB no backend)
    client_max_body_size 32m;

    # Worker do pdf.js na raiz: cache curto (versão muda sem hash no nome).
    location = /pdf.worker.min.mjs {
        types { text/javascript mjs; }
        default_type text/javascript;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # ES modules (.mjs, ex.: assets hashados) precisam de MIME de JavaScript;
    # sem isso o import() dinâmico falha por checagem estrita de MIME.
    location ~* \.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Assets com hash: cache longo e 404 real (nunca devolver index.html no lugar)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32m;
    }
}
